<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciativas de Transformación · UNIMINUTO Cundinamarca-Boyacá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --navy-deep:#0B1533;
  --navy:#1A2E5A;
  --navy-2:#1F3661;
  --blue:#2250A0;
  --gold:#F5A800;
  --gold-soft:#FFD37A;
  --ink:#0D1730;
  --paper:#F5F6FA;
  --paper-2:#E0E4EC;
  --mist:#8E9BBE;
  --ok:#2FA86A;
  --warn:#E0A63C;
  --risk:#D65B4A;
  --font:'Poppins',-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:var(--navy-deep);
  color:var(--paper);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold);color:var(--navy-deep);}

/* ===== DECK SHELL ===== */
#deck{position:relative;width:100vw;height:100vh;overflow:hidden;}

.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  transform:translateY(24px) scale(.99);
  transition:opacity .55s cubic-bezier(.22,.8,.3,1), transform .6s cubic-bezier(.22,.8,.3,1), visibility 0s linear .55s;
  padding:0;
}
.slide.active{
  opacity:1;visibility:visible;transform:translateY(0) scale(1);
  transition:opacity .6s cubic-bezier(.22,.8,.3,1), transform .65s cubic-bezier(.22,.8,.3,1), visibility 0s;
  z-index:5;
}
.slide-inner{
  flex:1;width:100%;height:100%;
  padding:64px 84px 56px 84px;
  display:flex;flex-direction:column;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:rgba(245,168,0,.4) transparent;
}
.slide-inner::-webkit-scrollbar{width:6px;}
.slide-inner::-webkit-scrollbar-thumb{background:rgba(245,168,0,.35);border-radius:3px;}

.slide.dark{background:radial-gradient(1200px 700px at 85% -10%, rgba(34,80,160,.35), transparent 60%), linear-gradient(160deg,var(--navy-deep) 0%, var(--navy) 55%, var(--navy-2) 100%); color:var(--paper);}
.slide.light{background:linear-gradient(180deg,#FFFFFF 0%, var(--paper) 100%); color:var(--ink);}

/* Eyebrow / kicker */
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12.5px;letter-spacing:2.6px;font-weight:600;text-transform:uppercase;
  color:var(--gold);margin-bottom:14px;
}
.slide.light .eyebrow{color:var(--blue);}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--gold);display:inline-block;}
.slide.light .eyebrow::before{background:var(--blue);}

h1.title{font-size:44px;font-weight:700;line-height:1.12;letter-spacing:-.5px;max-width:920px;}
h2.title{font-size:34px;font-weight:700;line-height:1.16;letter-spacing:-.3px;max-width:880px;}
.subtitle{font-size:17px;font-weight:400;color:var(--mist);margin-top:10px;max-width:640px;line-height:1.5;}
.slide.light .subtitle{color:#5B6478;}

/* ===== NAVIGATION CHROME ===== */
#progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));z-index:100;transition:width .5s cubic-bezier(.22,.8,.3,1);}

#navdots{
  position:fixed;right:26px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:10px;z-index:90;
}
.navdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:all .3s;position:relative;}
.navdot:hover{background:rgba(255,255,255,.55);}
.navdot.active{background:var(--gold);height:24px;border-radius:4px;}

.arrow-btn{
  position:fixed;top:50%;transform:translateY(-50%);
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  color:var(--paper);font-size:18px;cursor:pointer;z-index:90;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s, transform .2s;
  backdrop-filter:blur(6px);
}
.arrow-btn:hover{background:rgba(245,168,0,.25);border-color:var(--gold);}
.arrow-btn.prev{left:16px;} .arrow-btn.next{right:74px;}
.arrow-btn:disabled{opacity:.25;cursor:default;}

#counter{
  position:fixed;bottom:22px;left:84px;z-index:90;
  font-size:12.5px;color:var(--mist);letter-spacing:1px;font-variant-numeric:tabular-nums;
}
#counter b{color:var(--gold);font-weight:600;}

#brand-tag{
  position:fixed;bottom:22px;right:84px;z-index:90;
  font-size:11px;letter-spacing:1.6px;color:rgba(255,255,255,.35);text-transform:uppercase;
}

/* TOC panel */
#toc-toggle{
  position:fixed;top:22px;left:84px;z-index:95;
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  padding:8px 16px;border-radius:24px;cursor:pointer;color:var(--paper);
  font-size:12.5px;letter-spacing:1px;backdrop-filter:blur(6px);
  transition:background .2s;
}
#toc-toggle:hover{background:rgba(245,168,0,.2);}
#toc-toggle .bars{display:flex;flex-direction:column;gap:3px;}
#toc-toggle .bars span{width:14px;height:2px;background:var(--gold);border-radius:1px;}

#toc-panel{
  position:fixed;inset:0;z-index:200;
  background:rgba(11,21,51,.88);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .35s;
}
#toc-panel.open{opacity:1;pointer-events:all;}
#toc-grid{
  display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px;
  max-width:1100px;width:92%;max-height:82vh;overflow-y:auto;padding:10px;
}
.toc-item{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .2s;
}
.toc-item:hover{background:rgba(245,168,0,.15);border-color:var(--gold);transform:translateY(-2px);}
.toc-item .n{font-size:11px;color:var(--gold);letter-spacing:1.5px;font-weight:600;}
.toc-item .t{font-size:14.5px;font-weight:500;margin-top:4px;line-height:1.35;}
#toc-close{position:fixed;top:28px;right:84px;font-size:13px;color:var(--mist);cursor:pointer;letter-spacing:1px;z-index:201;}

/* ===== REUSABLE COMPONENTS ===== */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.4px;}
.pill.gold{background:rgba(245,168,0,.15);color:var(--gold-soft);border:1px solid rgba(245,168,0,.35);}
.pill.blue{background:rgba(34,80,160,.25);color:#8FB4EE;border:1px solid rgba(34,80,160,.5);}
.pill.light{background:rgba(255,255,255,.08);color:var(--paper);border:1px solid rgba(255,255,255,.16);}

.badge-num{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(145deg,var(--gold),#C97F00);
  color:var(--navy-deep);font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 4px 14px rgba(245,168,0,.35);
}

.card{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px;padding:22px 24px;
}
.slide.light .card{background:#fff;border:1px solid #E5E8F0;box-shadow:0 2px 18px rgba(20,30,60,.05);}

.grid{display:grid;gap:18px;}
.g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);} .g5{grid-template-columns:repeat(5,1fr);}

/* Scroll hint */
.scrollhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--mist);letter-spacing:1.5px;text-transform:uppercase;opacity:.55;display:none;}
.slide-inner.scrollable + .scrollhint{display:block;}

@media (max-width:900px){
  .slide-inner{padding:90px 22px 70px 22px;}
  h1.title{font-size:30px;} h2.title{font-size:24px;}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr;}
  #navdots{display:none;}
  .arrow-btn{width:38px;height:38px;}
  #counter,#brand-tag{left:22px;right:22px;}
  #toc-toggle{left:22px;}
  #toc-close{right:22px;}
}
</style>
<style id="extra-css">
.mini-label{font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);opacity:.85;}
.slide.light .mini-label{color:var(--blue);}
.mini-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;margin-right:10px;flex-shrink:0;}
.star{font-size:18px;}

/* --- Portada orbit --- */
.orbit-wrap{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:640px;height:640px;opacity:.55;pointer-events:none;}
.orbit-svg{width:100%;height:100%;}
.orbit-ring{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1;}
.orbit-spin-slow{transform-origin:450px 450px;animation:spin 90s linear infinite;}
.orbit-spin-med{transform-origin:450px 450px;animation:spin 60s linear infinite reverse;}
.orbit-spin-fast{transform-origin:450px 450px;animation:spin 40s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* --- Cascada --- */
.cascada-wrap{display:flex;flex-direction:column;gap:0;margin-top:16px;max-width:900px;}
.cascada-step{display:flex;gap:18px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 20px;}
.slide.light .cascada-step{background:#fff;border-color:#E5E8F0;}
.cascada-num{font-size:22px;font-weight:800;color:var(--gold);opacity:.5;width:40px;flex-shrink:0;}
.cascada-dur{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mist);font-weight:600;}
.cascada-title{font-size:15.5px;font-weight:700;margin:1px 0 3px;}
.cascada-desc{font-size:12px;color:var(--mist);line-height:1.42;max-width:640px;}
.slide.light .cascada-desc{color:#5B6478;}
.cascada-connector{text-align:center;color:var(--gold);opacity:.5;font-size:12px;line-height:1;padding:0;margin-left:20px;}

/* --- Frentes / Ejes lists --- */
.frentes-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.frente-row{display:flex;gap:12px;align-items:baseline;background:rgba(0,0,0,.03);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.4;}
.slide.dark .frente-row{background:rgba(255,255,255,.04);}
.frente-n{font-size:11px;font-weight:800;color:var(--blue);background:rgba(34,80,160,.12);padding:2px 8px;border-radius:6px;flex-shrink:0;}

/* --- Apuestas cards --- */
.apuesta-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:20px 16px;text-align:center;position:relative;overflow:hidden;}
.apuesta-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);}
.apuesta-dot{width:14px;height:14px;border-radius:50%;background:var(--c);margin:0 auto 12px;box-shadow:0 0 0 5px color-mix(in srgb, var(--c) 20%, transparent);}
.apuesta-name{font-size:13.5px;font-weight:600;line-height:1.35;}
.apuesta-tag{font-size:10px;color:var(--mist);margin-top:8px;font-style:italic;}
.ini-icon-sm{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto;}
.ini-icon-sm svg{width:22px;height:22px;}

/* --- Mapa de Iniciativas --- */
.mapa-orbit-wrap{position:relative;width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}
.mapa-hub{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px;}
.mapa-hub-circle{width:84px;height:84px;border-radius:50%;background:var(--gold);color:#0B1533;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(245,168,0,.12), 0 10px 26px rgba(0,0,0,.3);}
.mapa-hub-label{font-size:12px;color:var(--mist);letter-spacing:.5px;}
.mapa-fan{width:2px;height:34px;background:linear-gradient(180deg, rgba(245,168,0,.5), rgba(245,168,0,0));margin-bottom:6px;}
.mapa-cards{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,150px));gap:20px;}
.mapa-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px 14px;text-align:center;cursor:pointer;transition:all .25s;position:relative;}
.mapa-card:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 12px 30px rgba(0,0,0,.25);}
.mapa-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:var(--c);color:#0B1533;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;}
.mapa-ic{width:36px;height:36px;margin:8px auto 10px;color:var(--c);}
.mapa-ic svg{width:100%;height:100%;}
.mapa-name{font-size:12.5px;font-weight:600;line-height:1.3;min-height:32px;}
.mapa-motor{font-size:10.5px;color:var(--mist);margin-top:6px;}

/* --- Matriz table --- */
.matriz-table-wrap{margin-top:18px;overflow-x:auto;}
.matriz-table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:12.5px;}
.matriz-table th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:0 10px 8px;text-align:center;font-weight:700;}
.matriz-table td{background:rgba(255,255,255,.04);padding:14px 10px;text-align:center;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);}
.matriz-table td:first-child{text-align:left;border-radius:10px 0 0 10px;border-left:1px solid rgba(255,255,255,.06);}
.matriz-table td:last-child{border-radius:0 10px 10px 0;border-right:1px solid rgba(255,255,255,.06);}
.matriz-rowlabel{display:flex;align-items:center;font-size:13px;font-weight:600;white-space:nowrap;}

/* --- Metodología --- */
.l-track{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.l-step{display:flex;align-items:center;gap:14px;}
.l-badge{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--blue),#173e78);color:#fff;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.l-info b{font-size:13.5px;display:block;}
.l-info span{font-size:11.5px;color:var(--mist);}
.slide.light .l-info span{color:#5B6478;}
.dim-grid{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.dim-card{background:rgba(0,0,0,.03);border-radius:10px;padding:10px 14px;font-size:12.5px;}
.slide.dark .dim-card{background:rgba(255,255,255,.04);}
.dim-card b{display:block;font-size:13px;margin-bottom:2px;color:var(--blue);}
.slide.dark .dim-card b{color:var(--gold-soft);}
.dim-card span{color:var(--mist);}
.slide.light .dim-card span{color:#5B6478;}
.steps6{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.step6-chip{font-size:11px;background:rgba(34,80,160,.1);border:1px solid rgba(34,80,160,.25);color:var(--blue);padding:5px 10px;border-radius:8px;}
.slide.dark .step6-chip{background:rgba(245,168,0,.1);border-color:rgba(245,168,0,.3);color:var(--gold-soft);}

/* --- Ficha de iniciativa --- */
.ficha-header{display:flex;align-items:center;gap:20px;padding-bottom:18px;border-bottom:2px solid var(--c);}
.ficha-badge{width:52px;height:52px;border-radius:16px;background:var(--c);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ficha-header h2{flex:1;}
.ficha-avance{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.avance-ring{--deg:0deg;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--gold) var(--deg), rgba(0,0,0,.08) var(--deg));display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;transition:background 1s ease;}
.avance-ring::before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--paper);}
.slide.dark .avance-ring::before{background:var(--navy);}
.avance-ring span{position:relative;font-size:13px;font-weight:800;}
.avance-label{font-size:11.5px;font-weight:700;line-height:1.3;}
.avance-label.ok{color:var(--ok);} .avance-label.warn{color:var(--warn);} .avance-label.risk{color:var(--risk);}
.ficha-text{font-size:13.5px;line-height:1.65;color:inherit;opacity:.9;margin-top:8px;}
.acc-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.acc-row{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.4;}
.acc-n{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#0B1533;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.metas2030-strip{margin-top:20px;}
.meta-box{background:var(--navy);color:#fff;border-radius:12px;padding:16px 14px;text-align:center;}
.slide.light .meta-box{background:linear-gradient(145deg,var(--navy),var(--navy-2));}
.meta-box b{display:block;font-size:20px;color:var(--gold);}
.meta-box span{font-size:11px;color:var(--mist);line-height:1.3;display:block;margin-top:4px;}

/* --- Roadmap --- */
.roadmap-table-wrap{margin-top:20px;overflow-x:auto;flex:1;}
.roadmap-table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:12.5px;}
.roadmap-table th{color:var(--gold);font-size:12px;padding:0 10px 10px;text-align:left;font-weight:700;}
.roadmap-table td{background:rgba(255,255,255,.045);padding:16px 12px;border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);}
.roadmap-table td:first-child{border-radius:10px 0 0 10px;border-left:3px solid var(--c);font-weight:700;font-size:12.5px;}
.roadmap-table td:last-child{border-radius:0 10px 10px 0;}
.roadmap-final{color:var(--gold-soft);font-weight:600;}
.roadmap-rowlabel{min-width:170px;}

/* --- Plan de Trabajo --- */
.pt-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.pt-tab{font-size:12px;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:all .2s;font-weight:500;}
.pt-tab:hover{border-color:var(--c);}
.pt-tab.active{background:var(--c);border-color:var(--c);color:#fff;font-weight:700;}
.pt-summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px;}
.pt-stat{background:rgba(255,255,255,.045);border-radius:10px;padding:12px 10px;text-align:center;}
.pt-stat b{display:block;font-size:19px;color:var(--gold);}
.pt-stat span{font-size:10px;color:var(--mist);line-height:1.25;display:block;margin-top:3px;}
.pt-toolbar{display:flex;gap:10px;margin-top:16px;}
.pt-toolbar input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;color:#fff;font-size:13px;font-family:var(--font);}
.pt-toolbar input::placeholder{color:var(--mist);}
.pt-toolbar select{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;color:#fff;font-size:13px;font-family:var(--font);}
.pt-list{margin-top:14px;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto;padding-right:4px;}
.pt-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:14px 16px;}
.pt-card-top{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.pt-card-accion{font-size:13.5px;font-weight:600;line-height:1.4;}
.pt-card-meta{font-size:11.5px;color:var(--mist);margin-top:6px;line-height:1.5;}
.pt-card-tag{font-size:11px;margin-top:6px;padding:6px 10px;border-radius:8px;line-height:1.4;}
.pt-card-tag.risk{background:rgba(214,91,74,.12);color:#F0A99A;}
.pt-card-tag.opp{background:rgba(47,168,106,.12);color:#8FDBAF;}
.avance-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;}

<script>

/* =========================================================
   ENSAMBLAJE DE DIAPOSITIVAS — Lineamientos DataHub
   ========================================================= */
const SLIDES = [
  {title:'Portada', cls:'dark', render:slidePortada},
  {title:'¿Qué es el DataHub?', cls:'light', render:slidePresentacion},
  {title:'Objetivo y Alcance', cls:'dark', render:slideObjetivoAlcance},
  {title:'9 Principios de Gestión de la Información', cls:'light', render:slidePrincipios},
  {title:'Roles y Responsabilidades', cls:'dark', render:slideRoles},
  {title:'Ciclo de Vida de un Informe', cls:'light', render:slideCicloVida},
  {title:'Requisitos Mínimos para Crear un Informe', cls:'dark', render:slideRequisitosMinimos},
  {title:'Requisitos Obligatorios de Todo Tablero', cls:'light', render:slideRequisitosObligatorios},
  {title:'Fecha de Corte vs. Fecha de Actualización', cls:'dark', render:slideFechaCorte},
  {title:'Validación de Datos y Presentación', cls:'light', render:slideValidacion},
  {title:'Lineamientos para Informes con IA', cls:'dark', render:slideIA},
  {title:'Procedimiento para Publicar', cls:'light', render:slideProcedimiento},
  {title:'Gestión de Actualizaciones y Semáforo', cls:'dark', render:slideSemaforo},
  {title:'Uso del DataHub en Modo Consulta', cls:'light', render:slideUsoConsulta},
  {title:'Inconsistencias y Escalamiento', cls:'dark', render:slideEscalamiento},
  {title:'Estructura de Tablero y Criterios Visuales', cls:'light', render:slideEstructura},
  {title:'Lista de Chequeo Interactiva', cls:'dark', render:slideChecklist},
  {title:'Anexos', cls:'light', render:slideAnexos},
  {title:'Cierre y Criterio de Adopción', cls:'dark', render:slideCierre},
];

let current = 0;
const deck = document.getElementById('deck');

function buildDeck(){
  SLIDES.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className = `slide ${s.cls}`;
    el.dataset.index = i;
    el.innerHTML = s.render();
    deck.appendChild(el);
  });
  document.getElementById('tot').textContent = String(SLIDES.length).padStart(2,'0');
  buildDots();
  buildTOC();
  goTo(0, true);
}

function buildDots(){
  const wrap = document.getElementById('navdots');
  wrap.innerHTML = SLIDES.map((s,i)=>`<div class="navdot" data-i="${i}" onclick="goTo(${i})" title="${s.title}"></div>`).join('');
}

function buildTOC(){
  const grid = document.getElementById('toc-grid');
  grid.innerHTML = SLIDES.map((s,i)=>`
    <div class="toc-item" onclick="goTo(${i});toggleTOC();">
      <div class="n">${String(i+1).padStart(2,'0')}</div>
      <div class="t">${s.title}</div>
    </div>`).join('');
}

function toggleTOC(){document.getElementById('toc-panel').classList.toggle('open');}

function goTo(i, instant){
  if(i<0 || i>=SLIDES.length) return;
  const slides = document.querySelectorAll('.slide');
  slides.forEach(s=>s.classList.remove('active'));
  current = i;
  slides[i].classList.add('active');
  document.getElementById('cur').textContent = String(i+1).padStart(2,'0');
  document.getElementById('progress').style.width = `${((i+1)/SLIDES.length)*100}%`;
  document.querySelectorAll('.navdot').forEach((d,di)=>d.classList.toggle('active', di===i));
  document.querySelector('.arrow-btn.prev').disabled = (i===0);
  document.querySelector('.arrow-btn.next').disabled = (i===SLIDES.length-1);
  animateRings(slides[i]);
  if(SLIDES[i].title==='Lista de Chequeo Interactiva'){ initChecklist(slides[i]); }
  if(SLIDES[i].title==='Anexos'){ initAnexos(slides[i]); }
}

function go(delta){ goTo(current+delta); }

function animateRings(slideEl){
  slideEl.querySelectorAll('.avance-ring').forEach(r=>{
    const val = parseFloat(r.dataset.val)||0;
    const deg = Math.min(360, (val/100)*360);
    r.style.setProperty('--deg', `${deg}deg`);
  });
}

/* Keyboard + swipe */
document.addEventListener('keydown', e=>{
  if(document.getElementById('toc-panel').classList.contains('open')){
    if(e.key==='Escape') toggleTOC();
    return;
  }
  if(['ArrowRight','PageDown',' '].includes(e.key)){ go(1); e.preventDefault(); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ go(-1); e.preventDefault(); }
  if(e.key==='Home') goTo(0);
  if(e.key==='End') goTo(SLIDES.length-1);
});
let touchX=null;
document.addEventListener('touchstart', e=>{touchX=e.touches[0].clientX;});
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>60){ go(dx<0?1:-1); }
  touchX=null;
});

/* =========================================================
   CHECKLIST — interactividad con progreso en vivo
   ========================================================= */
function initChecklist(slideEl){
  const list = slideEl.querySelector('#checklistList');
  const ring = slideEl.querySelector('#checkRing');
  const label = slideEl.querySelector('#checkRingLabel');
  const resetBtn = slideEl.querySelector('#checkReset');
  if(!list || list.dataset.bound==='1') { updateChecklistProgress(slideEl); return; }
  list.dataset.bound = '1';
  list.querySelectorAll('.checklist-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      item.classList.toggle('checked');
      updateChecklistProgress(slideEl);
    });
  });
  resetBtn.addEventListener('click', ()=>{
    list.querySelectorAll('.checklist-item').forEach(i=>i.classList.remove('checked'));
    updateChecklistProgress(slideEl);
  });
  updateChecklistProgress(slideEl);
}

function updateChecklistProgress(slideEl){
  const list = slideEl.querySelector('#checklistList');
  const total = list.querySelectorAll('.checklist-item').length;
  const done = list.querySelectorAll('.checklist-item.checked').length;
  const ring = slideEl.querySelector('#checkRing');
  const label = slideEl.querySelector('#checkRingLabel');
  const deg = total ? (done/total)*360 : 0;
  ring.style.setProperty('--deg', `${deg}deg`);
  label.textContent = `${done}/${total}`;
}

/* =========================================================
   ANEXOS — pestañas
   ========================================================= */
function initAnexos(slideEl){
  const tabs = slideEl.querySelector('#annexTabs');
  if(!tabs || tabs.dataset.bound==='1') return;
  tabs.dataset.bound = '1';
  tabs.querySelectorAll('.pt-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.querySelectorAll('.pt-tab').forEach(t=>t.classList.toggle('active', t===tab));
      const panel = slideEl.querySelector('#annexPanel');
      const key = tab.dataset.annex;
      if(key==='ficha') panel.innerHTML = renderAnnexFicha();
      if(key==='decl') panel.innerHTML = renderAnnexDecl();
      if(key==='gloss') panel.innerHTML = renderAnnexGloss();
    });
  });
}

document.addEventListener('DOMContentLoaded', buildDeck);

</script>
</body>
